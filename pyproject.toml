[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-gouv-cli"
version = "0.1.0"
description = "Token-efficient CLI for AI agents to query French public data (data.gouv.fr)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.16"
authors = [
    { name = "yanis.labeyrie" },
]
keywords = [
    "data-gouv",
    "opendata",
    "data-gouv-fr",
    "duckdb",
    "sql",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12",
    "rich",
    "requests>=2.31",
    "python-toon>=0.1.3",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyarrow>=15.0",
    "duckdb>=1.2.0",
    "click",
    "cyclopts",
    "rapidfuzz",
]

[project.scripts]
data-gouv-cli = "run_data_gouv_cli:main"

[project.optional-dependencies]
remote = [
    "remotezip>=0.12.3",
]

[project.urls]
Homepage = "https://github.com/aiandcivilization/data-gouv-cli"
Repository = "https://github.com/aiandcivilization/data-gouv-cli"
Issues = "https://github.com/aiandcivilization/data-gouv-cli/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "data_gouv_logic",
    "run_data_gouv_cli",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored code is not ours to lint. Fixing it here would diverge
# from the upstream copy recorded in VENDOR.md.
exclude = ["src/_vendor"]

[tool.ruff.lint]
# Start with correctness only; raise the bar once the tree is clean.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
